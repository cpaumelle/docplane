services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-docs}
      POSTGRES_USER: ${POSTGRES_USER:-docs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-docs} -d ${POSTGRES_DB:-docs}"]
      interval: 5s
      timeout: 3s
      retries: 20

  # One-shot volume initialiser. MUST complete before docs-api and docs-web.
  #
  # WHY THIS EXISTS: docs-site is shared by docs-api (writer, runs as
  # DOCPLANE_SITE_UID) and docs-web (nginx, reads it). Docker populates an
  # EMPTY named volume from the image of whichever container mounts it first,
  # and carries that image's ownership across with it. The nginx image ships
  # content at /usr/share/nginx/html owned by root, so on a fresh install nginx
  # wins, the volume becomes root-owned, and docs-api can never promote a
  # release into it — publication fails at the rsync step with EACCES.
  #
  # Two mechanisms, because one is not enough. Population happens at container
  # CREATE time, and Compose creates every service before starting any, so nginx
  # may well populate the volume before this service has run at all:
  #
  #   chown -R  repairs that. It is the primary fix, and it also heals an
  #             installation already broken by the race. Ordering guarantees
  #             it runs after creation and before docs-api needs to write.
  #   sentinel  stops any LATER repopulation. Docker only populates an EMPTY
  #             volume, and re-populating resets ownership back to root, so a
  #             volume that is never empty can never be silently re-rooted
  #             (e.g. docs-web recreated against a drained volume). The
  #             generator excludes it from rsync --delete so it survives every
  #             publish.
  #
  # Verified against real containers by scripts/integration-fresh-install.sh.
  site-init:
    image: alpine:3
    user: "0:0"                 # deliberately root; exists only to hand the volume to a non-root writer
    restart: "no"
    command:
      - sh
      - -c
      - |
        set -e
        mkdir -p /data/site
        # -R also repairs an installation already broken by the race above.
        chown -R ${DOCPLANE_SITE_UID:-10001}:${DOCPLANE_SITE_GID:-10001} /data/site
        chmod 755 /data/site
        touch /data/site/.docplane-site-init
        chown ${DOCPLANE_SITE_UID:-10001}:${DOCPLANE_SITE_GID:-10001} /data/site/.docplane-site-init
    volumes:
      - docs-site:/data/site

  docs-api:
    build:
      context: .
      dockerfile: docs-api/Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
        BUILD_TIMESTAMP: ${BUILD_TIMESTAMP:-unknown}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      site-init:
        condition: service_completed_successfully
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-docs}
      DB_USER: ${POSTGRES_USER:-docs}
      DB_PASS: ${POSTGRES_PASSWORD}
      DOCPLANE_BOOTSTRAP_TOKEN: ${DOCPLANE_BOOTSTRAP_TOKEN:?set DOCPLANE_BOOTSTRAP_TOKEN}
      DOCPLANE_EVENT_CURSOR_SECRET: ${DOCPLANE_EVENT_CURSOR_SECRET:?set DOCPLANE_EVENT_CURSOR_SECRET}
      DOCS_CONTENT_DIR: /data/docs
      MKDOCS_CONFIG_DIR: /data/mkdocs
      MKDOCS_BASE_CONFIG: /app/mkdocs/mkdocs.yml
      DOCS_SITE_DIR: /data/site
      DOCPLANE_PUBLICATION_WEBHOOKS: ${DOCPLANE_PUBLICATION_WEBHOOKS:-}
    volumes:
      - docs-content:/data/docs
      - mkdocs-config:/data/mkdocs
      - docs-site:/data/site
    ports:
      - "${DOCPLANE_API_PORT:-8010}:8010"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8010/healthz"]
      interval: 10s
      timeout: 5s
      retries: 20

  dashboard:
    build: ./dashboard
    restart: unless-stopped
    depends_on:
      docs-api:
        condition: service_healthy
    environment:
      DOCPLANE_API_URL: http://docs-api:8010
    ports:
      - "${DOCPLANE_DASHBOARD_PORT:-8051}:8051"

  docs-web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      docs-api:
        condition: service_healthy
      # Explicit, not merely transitive through docs-api: nginx is the service
      # that would otherwise populate docs-site with its own root-owned content.
      site-init:
        condition: service_completed_successfully
    volumes:
      - docs-site:/usr/share/nginx/html:ro
      # Unified front: serve docs at / and mount the authoring dashboard under
      # /dashboard (exact-match asset/API routing; see mkdocs/docplane-front.conf).
      - ./mkdocs/docplane-front.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${DOCPLANE_SITE_PORT:-8080}:80"

  docs-mcp:
    build: ./mcp
    restart: unless-stopped
    depends_on:
      docs-api:
        condition: service_healthy
    environment:
      DOCPLANE_API_URL: http://docs-api:8010
      DOCPLANE_TOKEN: ${DOCPLANE_TOKEN:-}
      MCP_API_KEY: ${MCP_API_KEY:?set MCP_API_KEY}
      # Leave these EMPTY to accept the port-aware default computed in
      # server.py. Setting them overrides the default entirely.
      MCP_ALLOWED_HOSTS: ${MCP_ALLOWED_HOSTS:-}
      MCP_ALLOWED_ORIGINS: ${MCP_ALLOWED_ORIGINS:-}
      # The published port, which is what a client puts in the Host header.
      # The container cannot infer it from its own listening port, so it must
      # be told; otherwise any non-default DOCPLANE_MCP_PORT yields 421.
      MCP_PUBLIC_PORT: ${DOCPLANE_MCP_PORT:-8049}
    ports:
      - "${DOCPLANE_MCP_PORT:-8049}:8049"

volumes:
  postgres-data:
  docs-content:
  mkdocs-config:
  docs-site:
