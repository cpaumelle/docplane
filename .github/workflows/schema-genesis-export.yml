name: schema-genesis-export

on:
  pull_request:
    paths:
      - "db/migrations/**"
      - "docs-api/migrate.py"
      - ".github/workflows/schema-genesis-export.yml"

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: docs
          POSTGRES_USER: docs
          POSTGRES_PASSWORD: test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U docs -d docs"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_NAME: docs
      DB_USER: docs
      DB_PASS: test-only-password
      PGPASSWORD: test-only-password
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: docs-api/requirements-test.txt
      - name: Install migration dependencies
        working-directory: docs-api
        run: python -m pip install -r requirements-test.txt
      - name: Apply current migration chain
        working-directory: docs-api
        run: python migrate.py apply
      - name: Export canonical final schema and deterministic seed state
        run: |
          mkdir -p schema-export
          pg_dump \
            --host=127.0.0.1 \
            --username=docs \
            --dbname=docs \
            --schema-only \
            --no-owner \
            --no-privileges \
            --schema=docs \
            --schema=docplane \
            --schema=work \
            --exclude-table=docplane.schema_migrations \
            > schema-export/000_docplane_genesis.sql
          sed -i \
            -e '/^\\restrict /d' \
            -e '/^\\unrestrict /d' \
            -e '/^-- Dumped from database version/d' \
            -e '/^-- Dumped by pg_dump version/d' \
            -e '/^SET transaction_timeout/d' \
            -e 's/^CREATE SCHEMA docplane;$/CREATE SCHEMA IF NOT EXISTS docplane;/' \
            schema-export/000_docplane_genesis.sql
          cat >> schema-export/000_docplane_genesis.sql <<'SQL'

          -- Stable system workspaces. These identifiers are product constants, not install-time randomness.
          INSERT INTO docplane.workspaces
              (workspace_id, workspace_key, name, workspace_kind, visibility,
               mutation_policy, default_verification_days, retention_policy,
               system_workspace, created_at, updated_at)
          VALUES
              ('d0c00000-0000-5000-8000-000000000001', 'reference',
               'Reference', 'REFERENCE', 'INTERNAL', 'PROPOSAL_REQUIRED', 180,
               '{}'::jsonb, TRUE, now(), now()),
              ('d0c00000-0000-5000-8000-000000000002', 'operations',
               'Operations', 'OPERATIONS', 'INTERNAL', 'PROPOSAL_REQUIRED', 90,
               '{}'::jsonb, TRUE, now(), now()),
              ('d0c00000-0000-5000-8000-000000000003', 'work',
               'Active Work', 'WORK', 'INTERNAL', 'DIRECT_LOW_RISK', NULL,
               '{}'::jsonb, TRUE, now(), now()),
              ('d0c00000-0000-5000-8000-000000000004', 'migration-import',
               'Migration Import', 'MIGRATION', 'INTERNAL', 'PROPOSAL_REQUIRED', NULL,
               '{}'::jsonb, TRUE, now(), now());
          SQL
          if grep -q 'schema_migrations' schema-export/000_docplane_genesis.sql; then
            echo 'migration ledger leaked into genesis' >&2
            exit 1
          fi
          if grep -q '^COPY ' schema-export/000_docplane_genesis.sql; then
            echo 'bulk data dump leaked into genesis' >&2
            exit 1
          fi
          sha256sum schema-export/000_docplane_genesis.sql > schema-export/SHA256SUMS
          grep -E '^CREATE SCHEMA|^CREATE TABLE|^CREATE FUNCTION|^CREATE TRIGGER|^ALTER TABLE ONLY|^CREATE INDEX|^INSERT INTO docplane.workspaces' \
            schema-export/000_docplane_genesis.sql > schema-export/object-summary.txt || true
      - name: Prove genesis recreates the final empty-product authority
        run: |
          createdb --host=127.0.0.1 --username=docs docs_genesis
          psql --host=127.0.0.1 --username=docs --dbname=docs_genesis --set=ON_ERROR_STOP=1 <<'SQL'
          CREATE SCHEMA IF NOT EXISTS docplane;
          CREATE TABLE docplane.schema_migrations (
              ordinal integer PRIMARY KEY,
              filename text NOT NULL UNIQUE,
              checksum text NOT NULL,
              applied_at timestamptz NOT NULL DEFAULT now(),
              CONSTRAINT schema_migrations_ordinal_nonnegative CHECK (ordinal >= 0),
              CONSTRAINT schema_migrations_checksum_sha256 CHECK (checksum ~ '^[0-9a-f]{64}$')
          );
          SQL
          psql --host=127.0.0.1 --username=docs --dbname=docs_genesis --set=ON_ERROR_STOP=1 \
            --file=schema-export/000_docplane_genesis.sql
          for db in docs docs_genesis; do
            pg_dump \
              --host=127.0.0.1 \
              --username=docs \
              --dbname="$db" \
              --schema-only \
              --no-owner \
              --no-privileges \
              --schema=docs \
              --schema=docplane \
              --schema=work \
              --exclude-table=docplane.schema_migrations \
              > "schema-export/${db}-schema.sql"
            sed -i \
              -e '/^\\restrict /d' \
              -e '/^\\unrestrict /d' \
              -e '/^-- Dumped from database version/d' \
              -e '/^-- Dumped by pg_dump version/d' \
              -e '/^SET transaction_timeout/d' \
              "schema-export/${db}-schema.sql"
            psql --host=127.0.0.1 --username=docs --dbname="$db" \
              --tuples-only --no-align \
              --command="SELECT workspace_key || '|' || workspace_kind || '|' || mutation_policy || '|' || coalesce(default_verification_days::text, '') FROM docplane.workspaces ORDER BY workspace_key" \
              > "schema-export/${db}-seeds.txt"
            test "$(wc -l < "schema-export/${db}-seeds.txt" | tr -d ' ')" = 4
          done
          diff -u schema-export/docs-schema.sql schema-export/docs_genesis-schema.sql \
            > schema-export/schema.diff
          diff -u schema-export/docs-seeds.txt schema-export/docs_genesis-seeds.txt \
            > schema-export/seeds.diff
      - name: Upload genesis evidence
        uses: actions/upload-artifact@v4
        with:
          name: docplane-schema-genesis
          path: schema-export/
          if-no-files-found: error
          retention-days: 7
      - name: Commit consolidated genesis to the PR branch
        run: |
          cp schema-export/000_docplane_genesis.sql db/migrations/000_docplane_genesis.sql
          find db/migrations -maxdepth 1 -type f \
            -name '[0-9][0-9][0-9]_*.sql' \
            ! -name '000_docplane_genesis.sql' \
            -delete
          cat > docs/architecture/SCHEMA_GENESIS.md <<'MD'
          # Schema genesis and upgrades

          DocPlane ships one authoritative fresh-install schema:

          `db/migrations/000_docplane_genesis.sql`

          The genesis represents the final product schema and deterministic system seed state. It is not a historical replay of development migrations.

          The migration ledger is owned by `docs-api/migrate.py` and is deliberately excluded from the genesis SQL. On a new database, the runner creates the ledger, applies genesis once, records its checksum, and thereafter applies only numbered forward upgrades.

          Future released schema changes begin at `001_*.sql` and remain immutable after publication. A checksum or filename mismatch fails closed.

          The pre-release development chain that produced genesis was applied to disposable PostgreSQL 16, exported, restored into a clean database, and compared using normalized schema dumps plus semantic system-workspace seed evidence. Both comparisons were exact.

          System workspaces use stable product UUIDs so API references and deployment tooling do not depend on install-time randomness. Their timestamps remain install-time values.

          DocPlane does not support upgrading databases that recorded the discarded pre-release 000–015 development ledger. Those databases were never a released product contract and must be recreated or migrated through an explicit import path.
          MD
          rm .github/workflows/schema-genesis-export.yml
          git config user.name 'docplane-schema-bot'
          git config user.email 'docplane-schema-bot@users.noreply.github.com'
          git add -A db/migrations docs/architecture/SCHEMA_GENESIS.md .github/workflows/schema-genesis-export.yml
          git commit -m 'refactor(schema): consolidate pre-release chain into genesis'
          git push origin "HEAD:${GITHUB_HEAD_REF}"
