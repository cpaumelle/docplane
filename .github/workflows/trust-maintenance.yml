name: trust-maintenance

on:
  pull_request:
    paths:
      - "db/migrations/**"
      - "docs-api/app/trust_*.py"
      - "docs-api/app/workspace_access.py"
      - "docs-api/app/application.py"
      - "docs-api/tests/test_trust_*.py"
      - "docs-api/tests/test_wp8_migrations.py"
      - "docs/architecture/PAGE_TRUST.md"
      - ".github/workflows/trust-maintenance.yml"
  push:
    branches: [main]
    paths:
      - "db/migrations/**"
      - "docs-api/app/trust_*.py"
      - "docs-api/app/workspace_access.py"
      - "docs-api/app/application.py"
      - "docs-api/tests/test_trust_*.py"
      - "docs-api/tests/test_wp8_migrations.py"
      - "docs/architecture/PAGE_TRUST.md"
      - ".github/workflows/trust-maintenance.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: docs
          POSTGRES_USER: docs
          POSTGRES_PASSWORD: test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U docs -d docs"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_NAME: docs
      DB_USER: docs
      DB_PASS: test-only-password
      DOCS_API_KEY: legacy-test-only
      DOCPLANE_BOOTSTRAP_ADMIN_TOKEN: test-bootstrap-token
      DOCPLANE_API_PUBLIC_URL: http://docplane.test
      DOCPLANE_EVENT_CURSOR_SECRET: test-only-event-cursor-secret
      PGPASSWORD: test-only-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: docs-api/requirements-test.txt
      - name: Install dependencies
        working-directory: docs-api
        run: python -m pip install -r requirements-test.txt
      - name: Compile trust control plane
        run: python -m compileall -q docs-api/app docs-api/migrate.py
      - name: Apply complete migration chain
        working-directory: docs-api
        run: python migrate.py apply
      - name: Verify trust authorities
        run: |
          expected="$(find db/migrations -maxdepth 1 -type f -name '[0-9][0-9][0-9]_*.sql' | wc -l | tr -d ' ')"
          actual="$(psql -h 127.0.0.1 -U docs -d docs -Atc "select count(*) from docplane.schema_migrations")"
          test "$actual" = "$expected"
          test "$(psql -h 127.0.0.1 -U docs -d docs -Atc "select to_regclass('docs.page_metadata_history') is not null")" = t
          test "$(psql -h 127.0.0.1 -U docs -d docs -Atc "select to_regclass('docs.trust_mutation_receipts') is not null")" = t
          test "$(psql -h 127.0.0.1 -U docs -d docs -Atc "select to_regprocedure('docs.expire_due_verifications(timestamp with time zone)') is not null")" = t
          test "$(psql -h 127.0.0.1 -U docs -d docs -Atc "select to_regnamespace('analytics') is null")" = t
      - name: Trust lifecycle contract
        working-directory: docs-api
        run: >-
          python -m pytest -q --tb=short
          tests/test_trust_api_integration.py::test_classification_verification_invalidation_and_expiry_are_audited
      - name: Trust refusal contract
        working-directory: docs-api
        run: >-
          python -m pytest -q --tb=short
          tests/test_trust_api_integration.py::test_verification_refuses_unclassified_or_stale_revision
      - name: Prepare isolated event regression database
        run: |
          createdb -h 127.0.0.1 -U docs docs_events
          (cd docs-api && DB_NAME=docs_events python migrate.py apply)
      - name: Event contract regression
        working-directory: docs-api
        env:
          DB_NAME: docs_events
        run: python -m pytest -q --tb=short tests/test_event_cursor.py tests/test_event_api_integration.py
      - name: Migration contract regression
        working-directory: docs-api
        run: python -m pytest -q --tb=short tests/test_wp8_migrations.py
      - name: Build assembled API image
        run: docker build -t docplane-api:trust-test docs-api
