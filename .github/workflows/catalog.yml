name: catalog

on:
  pull_request:
    paths:
      - "catalog/**"
      - ".github/workflows/catalog.yml"
  push:
    branches: [main]
    paths:
      - "catalog/**"
      - ".github/workflows/catalog.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: catalog/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r catalog/requirements.txt
      - name: Compile
        run: python -m compileall -q catalog
      - name: Unit tests
        run: python -m unittest discover -s catalog/tests -v
