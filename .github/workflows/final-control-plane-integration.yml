name: final-control-plane-integration

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/final-control-plane-integration.yml"

permissions:
  contents: write

jobs:
  assemble:
    if: github.head_ref == 'agent/final-control-plane-integration'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/final-control-plane-integration
          fetch-depth: 0
          token: ${{ github.token }}
      - name: Assemble reviewed final state on current main
        run: |
          set -euo pipefail
          git fetch origin agent/schema-genesis-consolidation
          source_ref=origin/agent/schema-genesis-consolidation

          git checkout "$source_ref" -- \
            .github/workflows/events.yml \
            .github/workflows/reorganisation.yml \
            .github/workflows/trust-maintenance.yml \
            .github/workflows/workspaces-work.yml \
            db/migrations/000_docplane_genesis.sql \
            docs-api/app/agent_auth.py \
            docs-api/app/application.py \
            docs-api/app/event_api.py \
            docs-api/app/event_models.py \
            docs-api/app/event_store.py \
            docs-api/app/reorganisation_api.py \
            docs-api/app/reorganisation_models.py \
            docs-api/app/trust_api.py \
            docs-api/app/trust_models.py \
            docs-api/app/work_api.py \
            docs-api/app/work_models.py \
            docs-api/app/workspace_access.py \
            docs-api/tests/test_event_api_integration.py \
            docs-api/tests/test_reorganisation_api_integration.py \
            docs-api/tests/test_trust_api_integration.py \
            docs-api/tests/test_work_api_integration.py \
            docs-api/tests/test_work_models.py \
            docs-api/tests/test_wp8_migrations.py \
            docs/architecture/PAGE_TRUST.md \
            docs/architecture/REORGANISATION_CONTROL_PLANE.md \
            docs/architecture/SCHEMA_GENESIS.md

          rm -f \
            .github/workflows/events-usage.yml \
            db/migrations/000_base_docs.sql \
            db/migrations/001_corpus_certification.sql \
            db/migrations/002_corpus_certification_constraints.sql \
            db/migrations/003_redirect_register.sql \
            db/migrations/004_documentation_state_identity.sql \
            db/migrations/005_page_identity_is_diagnostic.sql \
            db/migrations/006_deployment_attempts.sql \
            db/migrations/007_deployment_seal_and_manifest.sql \
            db/migrations/008_validation_policy_identity.sql \
            db/migrations/009_recertify_policy_mode.sql \
            db/migrations/010_agent_identity_and_changes.sql \
            db/migrations/011_events_and_usage.sql \
            docs-api/app/usage_middleware.py

          git rm -f .github/workflows/final-control-plane-integration.yml
          git add -A
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "feat: integrate control plane on single genesis"
          git push origin HEAD:agent/final-control-plane-integration
