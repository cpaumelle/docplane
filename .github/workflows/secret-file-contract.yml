# SECRETS-V3 `_FILE` secret-source contract.
#
# The rule carrying the security weight is the NO-FALLBACK one: once <NAME>_FILE is deliberately
# configured, an unreadable or empty file must be a hard failure and must NOT silently revive
# legacy plaintext environment delivery. Without that, a migration can appear complete while the
# old path is still load-bearing -- and a rotation that revokes the old credential then fails in
# a way nobody predicted.
#
# The suite asserts every failure mode against a sentinel value, so a regression that leaks the
# secret into an exception, a warning or a repr fails the gate.
name: secret-file-contract

on:
  pull_request:
    paths:
      - "scripts/secret_source.py"
      - "scripts/work_catalogue.py"
      - "scripts/tests/**"
      - ".github/workflows/secret-file-contract.yml"
  push:
    branches: [main]
    paths:
      - "scripts/secret_source.py"
      - "scripts/work_catalogue.py"
      - "scripts/tests/**"
      - ".github/workflows/secret-file-contract.yml"

permissions:
  contents: read

jobs:
  secret-file-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pytest
        run: python -m pip install pytest==8.3.5
      - name: Compile
        run: python -m compileall -q scripts/secret_source.py scripts/work_catalogue.py
      - name: Contract + consumer-wiring tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set +e
          python -m pytest scripts/tests -q -rA -o xfail_strict=true \
            --junitxml=/tmp/secret-file-junit.xml
          rc=$?
          if [ "$rc" = "5" ]; then echo "::error::zero tests collected"; exit 1; fi
          if [ "$rc" != "0" ]; then exit "$rc"; fi
      - name: The governed bearer must never be read from the plaintext environment
        # A static backstop for the AST test: if someone reverts the call site, this fails even
        # if the test file were deleted in the same change.
        run: |
          if grep -nE '_required_environment\(\s*"DOCPLANE_WORK_CATALOGUE_TOKEN"' \
              scripts/work_catalogue.py; then
            echo "::error::DOCPLANE_WORK_CATALOGUE_TOKEN must be resolved via read_secret()"
            exit 1
          fi
          grep -q 'read_secret("DOCPLANE_WORK_CATALOGUE_TOKEN")' scripts/work_catalogue.py \
            || { echo "::error::call site does not use the _FILE contract"; exit 1; }
