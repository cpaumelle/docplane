name: fresh-instance

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: [self-hosted, linux, x64, charliehub]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: docs
          POSTGRES_USER: docs
          POSTGRES_PASSWORD: docs-test
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U docs -d docs"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DB_HOST: localhost
      DB_NAME: docs
      DB_USER: docs
      DB_PASS: docs-test
      DOCPLANE_BOOTSTRAP_TOKEN: test-bootstrap-token
      DOCPLANE_EVENT_CURSOR_SECRET: test-event-cursor-secret-123456789
    steps:
      - uses: actions/checkout@v4
      - name: Bind PostgreSQL service port
        run: echo "DB_PORT=${{ job.services.postgres.ports['5432'] }}" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build dashboard assets
        working-directory: dashboard
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm run check
          npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            docs-api/requirements.txt
            dashboard/requirements.txt
      - name: Install test dependencies
        run: |
          python -m pip install -r docs-api/requirements.txt pytest==8.3.5 httpx==0.27.2
      - name: Apply sole genesis
        run: python docs-api/migrate.py apply --dir db/migrations
      - name: Assert clean schema
        run: |
          docker exec -i "${{ job.services.postgres.id }}" psql -U docs -d docs -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF to_regclass('docplane.workspace_memberships') IS NOT NULL THEN
              RAISE EXCEPTION 'workspace_memberships must not exist';
            END IF;
            IF to_regclass('docs.change_proposals') IS NOT NULL THEN
              RAISE EXCEPTION 'change_proposals must not exist';
            END IF;
            IF to_regclass('docs.reorganisation_reviews') IS NOT NULL THEN
              RAISE EXCEPTION 'reorganisation_reviews must not exist';
            END IF;
            IF to_regclass('docs.changes') IS NULL OR to_regclass('docs.page_versions') IS NULL THEN
              RAISE EXCEPTION 'direct publication authority is incomplete';
            END IF;
          END;
          $$;
          SQL
      - name: Prove token-aware search uses trigram indexes
        run: |
          PLAN=$(docker exec -i "${{ job.services.postgres.id }}" psql -U docs -d docs -v ON_ERROR_STOP=1 <<'SQL'
          BEGIN;
          INSERT INTO docs.pages (path, title, nav_path, content, workspace_id, updated_by)
          SELECT
            'work/planner-' || n || '.md',
            'Synthetic planner page ' || n,
            'Planner / Synthetic / ' || n,
            CASE WHEN n = 100000
              THEN 'A stale systemd unit can block ceph-volume activation by FSID.'
              ELSE 'Ordinary corpus filler for trigram planner verification row ' || n
            END,
            (SELECT workspace_id FROM docplane.workspaces WHERE workspace_key = 'work'),
            'fresh-instance-search-plan'
          FROM generate_series(1, 100000) AS n;
          ANALYZE docs.pages;
          EXPLAIN (COSTS OFF)
          SELECT p.resource_id
          FROM docs.pages p
          WHERE (
            p.title ILIKE '%stale%' OR p.path ILIKE '%stale%'
            OR p.nav_path ILIKE '%stale%' OR p.content ILIKE '%stale%'
          ) AND (
            p.title ILIKE '%systemd%' OR p.path ILIKE '%systemd%'
            OR p.nav_path ILIKE '%systemd%' OR p.content ILIKE '%systemd%'
          );
          ROLLBACK;
          SQL
          )
          printf '%s\n' "$PLAN"
          grep -q 'Bitmap Index Scan' <<<"$PLAN"
          ! grep -q 'Seq Scan on pages' <<<"$PLAN"
      - name: Compile and test
        env:
          PYTHONPATH: docs-api:dashboard
        run: |
          python -m compileall -q docs-api dashboard mcp scripts/reconcile_generated_conditions.py
          # Every pytest root in the repository, named as directories rather
          # than as a file list. The previous hand-maintained enumeration
          # silently excluded every test file added after someone last
          # remembered to update it -- ten of them, including regression
          # tests written to guard specific defects.
          #
          # migration/tests and scripts/tests also have dedicated path-scoped
          # workflows; running them here too makes `verify` authoritative, so a
          # change outside those paths cannot skip them.
          #
          # test_ci_runs_every_test_file.py discovers test files REPO-WIDE and
          # fails the build if any is unreachable from this command, so a new
          # test root cannot appear without CI noticing.
          python -m pytest -q \
            docs-api/tests \
            mcp/tests \
            dashboard/tests \
            migration/tests \
            scripts/tests
      - name: Static legacy scan
        run: |
          ! grep -R -nE 'DOCS_API_KEY|X-API-Key|/api/agent-config|/api/docs/|workspace_memberships|change_proposals|reorganisation_reviews|Submit for review|SUBMITTED|APPROVED' \
            docs-api/app dashboard/app.py dashboard/authoring.py dashboard/static mcp docker-compose.yml README.md docs/architecture
      - name: Build images
        run: |
          docker build -f docs-api/Dockerfile -t docplane-api:test .
          docker build -t docplane-dashboard:test dashboard
          docker build -t docplane-mcp:test mcp
      # Real containers, real named volumes, empty start, non-default ports.
      # Unit tests cannot reach the container/volume ownership boundary or the
      # Host-header path, and both shipped broken precisely because CI never
      # stood the actual stack up.
      - name: Fresh-install integration test
        run: bash scripts/integration-fresh-install.sh
