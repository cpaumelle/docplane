name: dashboard

on:
  pull_request:
    paths:
      - "dashboard/**"
      - ".github/workflows/dashboard.yml"
  push:
    branches: [main]
    paths:
      - "dashboard/**"
      - ".github/workflows/dashboard.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: dashboard/package.json
      - name: Install dashboard assets
        working-directory: dashboard
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Check and build dashboard assets
        working-directory: dashboard
        run: |
          npm run check
          npm run build
          test -s static/editor.bundle.js
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: dashboard/requirements.txt
      - name: Install Python dependencies
        run: python -m pip install -r dashboard/requirements.txt pytest==8.3.5
      - name: Compile
        run: python -m compileall -q dashboard
      - name: Unit tests
        run: python -m pytest -q dashboard/tests
      - name: Build image
        run: docker build -t docplane-dashboard:test dashboard
