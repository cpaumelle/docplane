# Presentation configuration for the charliehub_domains schema catalogue.
#
# Authority: this file shapes the generated human pages and the stated
# canonical-schema availability only. It can never add, remove or alter
# structure — every table, column, key and index comes from introspection of
# the deployed database. Viewpoints naming tables that do not exist are
# rendered as "configured but absent", never invented.
#
# Canonical status vocabulary:
#   AVAILABLE         a canonical build from migrations is compared (phase 2)
#   NOT_YET_COMPARED  a migration source exists; comparison not built yet
#   NOT_AVAILABLE     no migration source can reproduce this schema; the
#                     catalogue is deployed introspection only and must never
#                     be treated as, or used to infer, a canonical schema

schemas:
  ccm:
    description: >-
      CCM-Edge desired and realization state for managed edges. Single writer:
      the Domain Manager CCM-Edge API (/api/ccm/edge/*); see services/ccm-edge.md
      and control-plane/foundational/ccm.md for authority and semantics.
    canonical:
      status: NOT_AVAILABLE
      reason: >-
        ccm.* was hand-applied and has no genesis migrations (Schema Migrations
        runbook, Known gaps). Only later domain-manager migrations (047 onward)
        alter it, so no clean migration build can reproduce it. This page shows
        the deployed structure only.
  ccm_security:
    description: >-
      CCM-Security edge SSH-defence desired state and derived projections,
      rendered by the Domain Manager CCM-Security renderer. No verified CRUD
      API: desired-state mutation is blocked pending a ratified sole writer;
      see services/ccm-security.md for authority and semantics.
    canonical:
      status: NOT_AVAILABLE
      reason: >-
        ccm_security.* was hand-applied alongside ccm.* with no genesis
        migrations; this page shows the deployed structure only.
  transit:
    description: >-
      Transit Manager desired state: WireGuard topology, edge nodes, execution
      paths, GEO, routing intent, guest VPN tenancy and contractor mediated
      access. Single writer: the Transit Manager API; see services/transit-manager.md.
    canonical:
      status: NOT_YET_COMPARED
      source: >-
        charliehub-hub2 transit-manager/migrations applied by
        scripts/migrate_schema.py (A12 ledger and clean-apply method)
      reason: >-
        A12 established that a clean migration apply reproduces production; the
        automated canonical-versus-deployed comparison is phase 2.
    viewpoints:
      - name: Fabric topology and routing intent
        description: Sites, WireGuard interfaces and peers, and the routing and NAT intent rendered from them.
        tables: [sites, site_subnets, interfaces, peers, pools, geos, main_routes, nat_rules, policy_rules, routing_overrides]
      - name: Edge nodes, deployment and execution
        description: Managed edge identity, links, trust, deploy evidence and GEO execution placement.
        tables: [sites, geos, edge_nodes, edge_links, edge_node_status, deploy_log, edge_node_source_prefixes, edge_destination_prefixes, edge_ingress_vlans, edge_trust, edge_wan_ssh_allowlist, edge_admin_keys, execution_paths, geo_executors]
      - name: Identity and mediated access
        description: Guest VPN tenancy (10.88) and contractor mediated access (10.90) through gateways, declared services and grants.
        tables: [peers, vpn_users, vpn_peer_ownership, vpn_invites, vpn_sites, vpn_peer_traffic_accumulator, share_tokens, gateway_peer_bindings, access_gateways, declared_services, service_endpoints, access_grants, contractor_identities, contractor_identity_events]
  public:
    description: >-
      Shared default schema of the charliehub_domains cluster. It has no single
      writer: it holds LAN Watcher observed-addressing tables (devices,
      ip_assignments, the lan_hosts view, lan_heartbeats, network_actions_log,
      device_icons, network_devices, infrastructure_assets, lan_hosts_legacy),
      CCM-LAN scope/reservation/realization tables (ccm_lan_*), the Domain
      Manager domains table, and control-plane tables (authelia_realms, nodes,
      deploy_log, governance_audit and others). Because the catalogue
      introspects whole schemas only, this page documents every public object,
      not one service. LAN Watcher is the only writer of, and the DDL/column
      authority for, its own tables and the lan_hosts view; see
      network/fabric-v2/lan-watcher.md and network/fabric-v2/lan-schema.md. Each
      other family is owned by its own service (services/ccm-lan.md,
      infrastructure/domain-manager.md); this catalogue page is deployed
      structure evidence, never an authority for any of them.
    canonical:
      status: NOT_AVAILABLE
      reason: >-
        public.* has no single migration source that reproduces it: its objects
        are created by several independent services (LAN Watcher
        lan-watcher/migrations, CCM-LAN, Domain Manager) plus hand-applied
        control-plane tables, so no clean migration build can reproduce this
        schema. This page shows the deployed structure only.
    viewpoints:
      - name: LAN Watcher observed addressing
        description: >-
          LAN Watcher observed LAN addressing and its derived read model. LAN
          Watcher is the only writer; DDL and column semantics are owned by
          network/fabric-v2/lan-schema.md.
        tables: [devices, ip_assignments, lan_hosts, lan_heartbeats, network_actions_log, device_icons, network_devices, infrastructure_assets, lan_hosts_legacy]
