# Presentation configuration for the Trevarn PRODUCTION PostgreSQL schema catalogue
# (db_key `trevarn`, source vps3 `trevarn-core/postgres`, database `trevarn`).
#
# Authority: structure is generated only from live projection-contract 2
# introspection of the deployed production database. This file supplies
# descriptions and the stated canonical-from-migrations status; it never adds,
# removes or filters structure.
#
# Runtime contract (settings file, not this file):
#   CATALOGUE_ENVIRONMENT=production
#   CATALOGUE_SOURCE_IDENTITY=VPS3/trevarn
#   CATALOGUE_SCHEMAS=platform,ingest,occupancy,analytics,parking,contact,public
#   CATALOGUE_LEDGER_TABLE=public.schema_migrations   (optional, needs the ledger grant)
#
# The candidate catalogue for an unreleased tree is a SEPARATE db_key
# (`trevarn_candidate`, config/schema-catalogue/trevarn_candidate.yml). Main's
# unapplied migrations are never presented as production structure here.
#
# Canonical status vocabulary (see charliehub_domains.yml): AVAILABLE,
# NOT_YET_COMPARED, NOT_AVAILABLE. Trevarn has one ordered migration source
# (trevarn-core db/baseline/*.sql applied by db/migrate.sh, recorded in
# public.schema_migrations), so a clean-apply comparison is possible but has not
# been built: every schema is NOT_YET_COMPARED. The deployed ledger head is
# captured at runtime when CATALOGUE_LEDGER_TABLE is set; it is never copied here.

schemas:
  platform:
    description: >-
      Trevarn's shared identity and tenant platform: tenants, users, memberships,
      API keys, device and gateway registries, locations, device twinning and its
      history, allocation, settings, audit and platform administration.
      Semantics: services/trevarn/database.md.
    canonical:
      status: NOT_YET_COMPARED
      source: >-
        trevarn-core db/baseline/*.sql applied in numeric order by db/migrate.sh;
        applied files and content hashes are recorded in public.schema_migrations.
      reason: >-
        A clean baseline apply is reproducible (CI applies the full baseline on every
        build) but the automated canonical-versus-deployed comparison is not built.
        This page shows deployed production structure only.
  ingest:
    description: >-
      Trevarn's ingestion layer: raw uplinks, LNS events, gateway reception,
      durable ingest spool, receipts and device notifications.
      Semantics: services/trevarn/database.md.
    canonical:
      status: NOT_YET_COMPARED
      source: >-
        trevarn-core db/baseline/*.sql applied by db/migrate.sh; ledger public.schema_migrations.
      reason: >-
        Clean apply reproducible in CI; canonical-versus-deployed comparison not built.
  occupancy:
    description: >-
      Trevarn occupancy and people-counter events, aggregates, install plans and
      sessions, inference, battery evidence and compatibility views over the
      platform twinning tables. Semantics: services/trevarn/database.md.
    canonical:
      status: NOT_YET_COMPARED
      source: >-
        trevarn-core db/baseline/*.sql applied by db/migrate.sh; ledger public.schema_migrations.
      reason: >-
        Clean apply reproducible in CI; canonical-versus-deployed comparison not built.
  analytics:
    description: >-
      Trevarn reporting projections consumed by the analytics interfaces and
      report APIs. Semantics: services/trevarn/database.md.
    canonical:
      status: NOT_YET_COMPARED
      source: >-
        trevarn-core db/baseline/*.sql applied by db/migrate.sh; ledger public.schema_migrations.
      reason: >-
        Clean apply reproducible in CI; canonical-versus-deployed comparison not built.
  parking:
    description: >-
      Trevarn parking sites, spaces, reservations, state transitions, downlink
      queue, actuations and display state. Semantics: services/trevarn/database.md.
    canonical:
      status: NOT_YET_COMPARED
      source: >-
        trevarn-core db/baseline/*.sql applied by db/migrate.sh; ledger public.schema_migrations.
      reason: >-
        Clean apply reproducible in CI; canonical-versus-deployed comparison not built.
  contact:
    description: >-
      Trevarn contact-study detections, asset-scan captures, twinning history and
      processing watermark. Semantics: services/trevarn/database.md.
    canonical:
      status: NOT_YET_COMPARED
      source: >-
        trevarn-core db/baseline/*.sql applied by db/migrate.sh; ledger public.schema_migrations.
      reason: >-
        Clean apply reproducible in CI; canonical-versus-deployed comparison not built.
  public:
    description: >-
      PostgreSQL's default schema, included as a whole by projection-contract 2.
      Holds the migration ledger public.schema_migrations (filename, sha256,
      applied_at); the ledger's row identity is captured as provenance when
      CATALOGUE_LEDGER_TABLE is configured. Semantics: services/trevarn/database.md.
    canonical:
      status: NOT_YET_COMPARED
      source: >-
        trevarn-core db/migrate.sh creates public.schema_migrations itself before applying the baseline.
      reason: >-
        Clean apply reproducible in CI; canonical-versus-deployed comparison not built.
