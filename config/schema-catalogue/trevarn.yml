# Presentation configuration for the Trevarn PostgreSQL schema catalogue.
#
# Authority: structure is generated only from live projection-contract 2
# introspection. This file supplies descriptions and migration provenance; it
# does not create or filter database structure.
#
# Runtime CATALOGUE_SCHEMAS must be: platform,ingest,occupancy,analytics,parking,contact,public.
# The verified source also has cbre_compat (3 tables and 1 view); it is an
# existing CBRE compatibility area and is excluded from this Trevarn catalogue.

schemas:
  platform:
    description: >-
      Trevarn's shared identity and tenant platform: users, memberships,
      API keys, tenant and device/gateway registries, allocation, settings,
      audit and platform administration. See services/trevarn/database.md.
    canonical:
      status: NOT_YET_COMPARED
      source: >-
        VM1124 development database trevarn; read-only evidence bundle in
        trevarn-core PR #276 at commit 1868c01728c92b08a7fa06b62c3fd65e6497d766.
        Source migrations 000–280 are from reviewed main 4ee75c8fd72df4a8fdc990fee6fc2ffa8691293b;
        migration 281 is in merged PR #270 (merge 113404d86b0e7321ad247b5d2b6272e887a50173);
        migrations 282–283 are in merged PR #274 (merge a83c9ef16d163229196c36420b6863abc0dac067).
        Current trevarn-core main is a83c9ef16d163229196c36420b6863abc0dac067.
        It additionally contains migrations 285–286 from merged PR #281
        (merge d3b3d4c62a51b1a400e9e1c53a7e1531a20883ac); those migrations are not
        represented by the VM1124 evidence bundle. PR #284 adds reader provisioning SQL;
        PR #286 updates its README; neither adds a numbered migration.
      reason: >-
        The evidence bundle captured 2026-10-09T11:38:08Z contains 81 migration-ledger
        entries through 283, and its schema-only DDL describes that VM1124 development
        state. Its migration hashes were verified against the reviewed migration sources.
        Current GitHub main has later schema migrations 285–286 that are not in this
        captured database state; the current main schema has therefore not been
        qualified as the VM1124 MODEL source. This catalogue is development evidence,
        not a claim about current GitHub-main schema or vps3 production parity.
        Contract 2 records migration_ledger as NOT_CAPTURED at runtime; the evidence
        bundle is supporting provenance only.
