# Presentation configuration for the Trevarn PostgreSQL schema catalogue.
#
# Authority: schema and object structure comes only from live projection-contract
# 2 introspection. This file supplies human descriptions and the known migration
# source; it does not create or filter database structure.

schemas:
  platform:
    description: >-
      Trevarn's shared identity and tenant platform: users, memberships,
      API keys, tenant and device/gateway registries, allocation, settings,
      audit and platform administration. See services/trevarn/database.md.
    canonical:
      status: AVAILABLE
      source: VM1124 isolated database trevarn_cutover; trevarn-core/db/migrate.sh; reported 81-entry ledger through 283
      reason: >-
        Qualification reported: 81 ledger entries through 283, comprising
        the 78 production-baseline migrations plus 281–283; hashes reported
        verified. The reviewed source commit SHA and schema-object comparison
        are not yet evidenced. Production parity is unverified; this catalogue
        describes the development target only.
