# Opt-in overlay: serve the WORK inbox secrets from SECRETS-V3 materialized files.
#
#   COMPOSE_FILE=docker-compose.yml:docker-compose.inbox-secrets.yml
#
# The base file stays unchanged, so a fresh install without a governed secret
# store still starts (with the optional inbox unavailable). With this overlay:
#
# * The host store must already hold the two principal directories, owned by
#   root and the secret store's group, mode 0750, each file 0440. On CharlieHub
#   these are the SECRETS-V3 entries docplane-inbox-api/* and
#   docplane-inbox-signing/* (group_read opt-in).
# * DOCPLANE_SECRETS_GID (required) is that group's numeric host GID. It comes
#   from the deployment, not from DocPlane: bind mounts keep numeric ownership,
#   so the container must hold the same number.
# * Whole directories are bind-mounted, not single files, so a key added or a
#   file atomically replaced by the materializer is visible without recreating
#   the container (a single-file bind mount keeps the old inode).
# * The API process (UID 10001) reads them only through that supplementary
#   group; the host never needs an account for the container UID.
# * Long-syntax binds do not create a missing source: an absent directory fails
#   the deployment rather than mounting an empty one.
#
# This overlay replaces the base file's _FILE/_DIR values. Do not also set the
# legacy DOCPLANE_WORK_INBOX_* value variables: the API refuses ambiguous sources.
services:
  docs-api:
    group_add:
      - "${DOCPLANE_SECRETS_GID:?set DOCPLANE_SECRETS_GID to the numeric host group that owns the inbox secret files}"
    environment:
      DOCPLANE_WORK_INBOX_CURSOR_SECRET_FILE: /run/docplane-inbox/api/cursor-secret
      DOCPLANE_WORK_INBOX_ACTIVE_KID_FILE: /run/docplane-inbox/api/active-kid
      DOCPLANE_WORK_INBOX_SIGNING_KEYS_DIR: /run/docplane-inbox/signing
    volumes:
      - type: bind
        source: ${DOCPLANE_SECRETS_ROOT:-/run/charliehub/secrets}/docplane-inbox-api
        target: /run/docplane-inbox/api
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${DOCPLANE_SECRETS_ROOT:-/run/charliehub/secrets}/docplane-inbox-signing
        target: /run/docplane-inbox/signing
        read_only: true
        bind:
          create_host_path: false
