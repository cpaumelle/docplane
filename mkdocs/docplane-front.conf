# DocPlane unified front (docs-web).
#
# Serves the rendered documentation site at / AND mounts the authoring
# dashboard under /dashboard, so a single fabric-scoped host presents:
#     https://docplane.charliehub.internal/            -> docs (content)
#     https://docplane.charliehub.internal/dashboard   -> authoring dashboard
#
# Dashboard and same-page editor assets use exact /assets routes that do not
# collide with MkDocs' /assets/{javascripts,stylesheets,images}/ namespaces.
#
# resolver + variable proxy_pass defers dashboard name resolution to request
# time, so docs-web still starts and serves documentation if the dashboard is
# briefly unavailable.
#
# AuthN unchanged: the host remains Traefik `fabric`-scoped. Reading is open to
# the fabric; editing requires an individual DocPlane contributor bearer token.

server {
    listen       80;
    listen  [::]:80;
    server_name  _;

    resolver 127.0.0.11 ipv6=off valid=30s;
    set $docplane_dashboard "docplane_dashboard";

    # ---- authoring dashboard under /dashboard ----
    location = /dashboard { return 301 /dashboard/; }

    location /dashboard/ {
        rewrite ^/dashboard/(.*)$ /$1 break;
        proxy_pass http://$docplane_dashboard:8051;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /dashboard;
    }

    # dashboard and same-page editor absolute assets (exact matches only)
    location = /assets/style.css          { proxy_pass http://$docplane_dashboard:8051$request_uri; proxy_set_header Host $host; }
    location = /assets/app.js             { proxy_pass http://$docplane_dashboard:8051$request_uri; proxy_set_header Host $host; }
    location = /assets/authoring.js       { proxy_pass http://$docplane_dashboard:8051$request_uri; proxy_set_header Host $host; }
    location = /assets/editor.bundle.js   { proxy_pass http://$docplane_dashboard:8051$request_uri; proxy_set_header Host $host; }
    location = /assets/inline-editor.js   { proxy_pass http://$docplane_dashboard:8051$request_uri; proxy_set_header Host $host; }
    location = /assets/inline-editor.css  { proxy_pass http://$docplane_dashboard:8051$request_uri; proxy_set_header Host $host; }

    # dashboard health endpoint (absolute /healthz on the dashboard)
    location = /healthz {
        proxy_pass http://$docplane_dashboard:8051$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # dashboard API and same-page authoring facade
    location /api/control-plane/ {
        proxy_pass http://$docplane_dashboard:8051$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- rendered documentation site (default) ----
    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html { root /usr/share/nginx/html; }
}
