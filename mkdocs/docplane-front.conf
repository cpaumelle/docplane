# DocPlane unified front (docs-web).
#
# Serves the rendered documentation site at / AND mounts the authoring
# dashboard under /dashboard, so a single fabric-scoped host presents:
#     https://docplane.charliehub.internal/            -> docs (content)
#     https://docplane.charliehub.internal/dashboard   -> authoring dashboard
#
# WHY THIS IS SAFE (no fragile HTML rewriting):
#   The dashboard SPA serves its shell at / and uses ABSOLUTE paths for exactly
#   four asset files (/assets/{style.css,app.js,authoring.js,editor.bundle.js}),
#   its API (/api/control-plane/*) and /healthz. None of those collide with the
#   rendered docs site, which only uses /assets/{javascripts,stylesheets,images}/.
#   So we route the dashboard's exact namespaces to it by exact/prefix match and
#   leave everything else to the static docs — no sub_filter, no rewrite of JS.
#
# WHY resolver + variable proxy_pass:
#   docs-web does not depend_on the dashboard; using the docker embedded resolver
#   (127.0.0.11) with a variable upstream defers name resolution to request time,
#   so nginx still starts if the dashboard is briefly down (docs stay served).
#
# AuthN unchanged: the host remains Traefik `fabric`-scoped, and the dashboard
# still requires a per-user contributor bearer token for every action.

server {
    listen       80;
    listen  [::]:80;
    server_name  _;

    resolver 127.0.0.11 ipv6=off valid=30s;
    set $docplane_dashboard "docplane_dashboard";

    # ---- authoring dashboard under /dashboard ----
    location = /dashboard { return 301 /dashboard/; }

    location /dashboard/ {
        rewrite ^/dashboard/(.*)$ /$1 break;
        proxy_pass http://$docplane_dashboard:8051;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /dashboard;
    }

    # dashboard's four absolute asset files (exact match; do not collide with docs)
    location = /assets/style.css        { proxy_pass http://$docplane_dashboard:8051$request_uri; proxy_set_header Host $host; }
    location = /assets/app.js           { proxy_pass http://$docplane_dashboard:8051$request_uri; proxy_set_header Host $host; }
    location = /assets/authoring.js     { proxy_pass http://$docplane_dashboard:8051$request_uri; proxy_set_header Host $host; }
    location = /assets/editor.bundle.js { proxy_pass http://$docplane_dashboard:8051$request_uri; proxy_set_header Host $host; }

    # dashboard health endpoint (absolute /healthz on the dashboard). Without
    # this exact route it would fall through to the static docs and 404.
    location = /healthz {
        proxy_pass http://$docplane_dashboard:8051$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # dashboard API (free namespace on the docs host)
    location /api/control-plane/ {
        proxy_pass http://$docplane_dashboard:8051$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- rendered documentation site (default) ----
    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html { root /usr/share/nginx/html; }
}
