# DocPlane unified front (docs-web).
#
# Serves rendered documentation at / and mounts the authoring dashboard under
# /dashboard, so one fabric-scoped host presents the complete human and agent
# product surface.
#
# Docker's embedded resolver is used with Compose service DNS names. Variable
# proxy_pass defers resolution to request time, so docs remain available if an
# application service is briefly unavailable during recreation.

server {
    listen       80;
    listen  [::]:80;
    server_name  _;

    resolver 127.0.0.11 ipv6=off valid=30s;
    set $docplane_dashboard "dashboard";
    set $docplane_docsapi "docs-api";

    # ---- human authoring dashboard ----
    location = /dashboard { return 301 /dashboard/; }

    location /dashboard/ {
        rewrite ^/dashboard/(.*)$ /$1 break;
        proxy_pass http://$docplane_dashboard:8051;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /dashboard;
    }

    # Dashboard and same-page editor assets use exact routes so they cannot
    # collide with MkDocs' /assets/{javascripts,stylesheets,images}/ trees.
    location = /assets/style.css          { proxy_pass http://$docplane_dashboard:8051$request_uri; proxy_set_header Host $host; }
    location = /assets/app.js             { proxy_pass http://$docplane_dashboard:8051$request_uri; proxy_set_header Host $host; }
    location = /assets/authoring.js       { proxy_pass http://$docplane_dashboard:8051$request_uri; proxy_set_header Host $host; }
    location = /assets/editor.bundle.js   { proxy_pass http://$docplane_dashboard:8051$request_uri; proxy_set_header Host $host; }
    location = /assets/inline-editor.js   { proxy_pass http://$docplane_dashboard:8051$request_uri; proxy_set_header Host $host; }
    location = /assets/inline-editor.css  { proxy_pass http://$docplane_dashboard:8051$request_uri; proxy_set_header Host $host; }

    # Same-page human facade. Publication includes synchronous certification and
    # MkDocs rendering, so nginx must stay open longer than the dashboard's
    # default 180-second control-plane client timeout.
    location /api/control-plane/ {
        proxy_pass http://$docplane_dashboard:8051$request_uri;
        proxy_http_version 1.1;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Idempotency-Key $http_idempotency_key;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- agent discovery and authoritative versioned API ----
    location = /.well-known/docplane.json {
        proxy_pass http://$docplane_docsapi:8010$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /openapi.json {
        proxy_pass http://$docplane_docsapi:8010$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/v1/ {
        proxy_pass http://$docplane_docsapi:8010$request_uri;
        proxy_http_version 1.1;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Idempotency-Key $http_idempotency_key;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Authority health named by the discovery contract.
    location = /healthz {
        proxy_pass http://$docplane_docsapi:8010$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- rendered documentation site ----
    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html { root /usr/share/nginx/html; }
}
