# ⚠️  PARTIALLY GENERATED — read before editing.
#
# This file holds the HAND-MAINTAINED mkdocs config (site name, theme, plugins,
# markdown_extensions, hooks).
#
# Page-move REDIRECTS are no longer appended here. They live in docs.redirects
# and are emitted by the generator into the child config alongside the nav, so
# the database stays the single source of truth for compatibility routes.
#
# The site NAV is NOT here. It is derived from PostgreSQL and regenerated on
# every deploy into a separate, git-IGNORED child config, mkdocs.nav.yml
# (INHERIT: mkdocs.yml + nav). The deploy builds that child config.
#
# SOURCE OF TRUTH: PostgreSQL (via docs-api).
# → Change docs/nav:  PUT /api/docs/pages/{path}
# → Then deploy:      automatic (or POST /api/docs/deploy)

site_name: !ENV [DOCPLANE_SITE_NAME, "DocPlane"]
site_url: !ENV [DOCPLANE_SITE_URL, null]   # unset -> header brand links to the site root (Home)
repo_url: ""

theme:
  name: material
  font: false                 # no external font fetches — good for offline/private nets
  palette:
    scheme: default
    primary: custom
    accent: custom
  features:
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.tabs.link
  custom_dir: overrides
  logo: assets/logo.svg
  favicon: assets/favicon.svg

extra_css:
  - assets/theme.css        # neutral shared design tokens
  - assets/brand-bridge.css # maps Material vars to the tokens
  - assets/header.css       # the ONE shared header (docs + dashboard)
  - assets/brand.css        # local brand override slot (neutral by default)

hooks:
  - hooks.py

# Declared as a MAPPING, not a list, and that is load-bearing.
#
# The generator emits DB-derived compatibility routes into the child config as
# plugins.redirects.redirect_maps. MkDocs deep-merges mapping-form config across
# INHERIT but REPLACES list-form values outright, so with a list here the child's
# plugins block would silently drop `search` and every other plugin. Keep this a
# mapping, and add new plugins here rather than in the generated child.
plugins:
  redirects:
    redirect_maps:
      # Placeholder keeps the map a valid non-empty mapping when the corpus has
      # no redirects. Its source path never exists, so the only artifact is a
      # harmless _moved/placeholder redirect page.
      _moved/placeholder.md: index.md
  search: {}

markdown_extensions:
  - tables
  - fenced_code
  - codehilite
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

extra:
  generator: false
