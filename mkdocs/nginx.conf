server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Don't let browsers MIME-sniff responses (defense-in-depth for /raw/).
    add_header X-Content-Type-Options "nosniff" always;

    # MkDocs uses clean URLs — try .html extension if directory index missing
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # Raw markdown sources (copied by hooks.py on_post_build). Serve with the
    # correct MIME type and no caching so agents always fetch fresh content.
    # NOTE: this used to live in nginx-raw.conf, which was never mounted by
    # docker-compose — merged here so it actually applies. Deliberately no
    # Access-Control-Allow-Origin header: same-origin fetches don't need CORS,
    # and a wildcard would let any external page's JS read internal docs from
    # a browser that can reach this host.
    location /raw/ {
        types {
            text/markdown md;
        }
        default_type text/markdown;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Serve pre-compressed assets if available
    gzip_static on;

    # Cache static assets aggressively
    location ~* \.(css|js|png|jpg|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
