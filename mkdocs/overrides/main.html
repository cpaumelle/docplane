{% extends "base.html" %}

{% block extrahead %}
  {{ super() }}
  <link rel="describedby" href="/.well-known/docplane.json" type="application/json">
{% endblock %}

{% block scripts %}
{{ super() }}
<link rel="stylesheet" href="/assets/inline-editor.css">
<script src="/assets/inline-editor.js" defer></script>
<!-- Mermaid diagrams. pymdownx.superfences emits <pre class="mermaid"><code>…</code></pre>;
     Mermaid v10+ wants <pre class="mermaid">…</pre> (no inner <code>), so unwrap first.
     NOTE: loaded from a CDN for convenience — if your docs are private or must
     work offline, download mermaid.min.js into docs-api-rendered assets or the
     overrides dir and change this src to a local path. -->
<script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function() {
  document.querySelectorAll('pre.mermaid > code').forEach(function(code) {
    var pre = code.parentElement;
    pre.textContent = code.textContent;
  });
  if (typeof mermaid !== 'undefined') {
    mermaid.initialize({ startOnLoad: false, theme: 'default' });
    mermaid.run({ querySelector: 'pre.mermaid' });
  }
});
</script>
<script>
// Reader surface: page action cluster, domain tint stamp, and the persistent
// context bar (title + breadcrumb + badge + actions stay reachable after the
// H1 scrolls away). Download/edit resolve the same canonical candidates;
// Verify mints a verification request through the fabric self-issue auth the
// inline editor provides (window.DocPlaneInlineEditor.auth/api).
document.addEventListener('DOMContentLoaded', function() {
  const contentHeader = document.querySelector('.md-content__inner h1');
  if (!contentHeader) return;

  const path = window.location.pathname.replace(/\/$/, '').replace(/^\//, '');
  // /guides/backups/ may be guides/backups.md OR guides/backups/index.md.
  const candidates = path === ''
    ? ['index.md']
    : [path + '.md', path + '/index.md'];
  const basename = path === '' ? 'index' : path.split('/').pop();

  // The generator's meta strip declares the page's domain; the body stamp
  // drives the domain page tint (theme.css).
  const strip = document.querySelector('.dp-badges');
  if (strip && strip.dataset.domain) document.body.dataset.dpDomain = strip.dataset.domain;

  // The generator exposes the authoritative docs.pages.version on the same
  // metadata strip that renders "Updated … · vN". Keep downloads traceable
  // without parsing presentation text.
  const pageVersion = strip && /^\d+$/.test(strip.dataset.pageVersion || '')
    ? strip.dataset.pageVersion
    : '';
  const filename = (pageVersion ? 'v' + pageVersion + '_' : '') + basename + '.md';

  async function download() {
    for (const candidate of candidates) {
      try {
        const resp = await fetch('/raw/' + candidate, { cache: 'no-cache' });
        if (!resp.ok) continue;
        const blob = await resp.blob();
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        a.click();
        URL.revokeObjectURL(url);
        return;
      } catch (e) { /* try next candidate */ }
    }
    window.open('/raw/' + candidates[0], '_blank');
  }

  function edit(trigger) {
    if (!window.DocPlaneInlineEditor) {
      window.alert('The visual editor is not available. Reload this page and try again.');
      return;
    }
    window.DocPlaneInlineEditor.start({
      candidates: candidates,
      articleSelector: '.md-content__inner',
      trigger: trigger
    });
  }

  const verifyButtons = [];
  async function verify() {
    const editorApi = window.DocPlaneInlineEditor;
    if (!editorApi || !editorApi.auth || !editorApi.api) {
      window.alert('The verification action is unavailable. Reload this page and try again.');
      return;
    }
    verifyButtons.forEach(function(b) { b.disabled = true; });
    try {
      await editorApi.auth();
      let resolved = null;
      for (const candidate of candidates) {
        try {
          resolved = await editorApi.api('/api/control-plane/authoring/lookup?path=' + encodeURIComponent(candidate));
          break;
        } catch (e) { /* try next candidate */ }
      }
      if (!resolved) throw new Error('This page could not be resolved for verification.');
      await editorApi.api('/api/v1/verification-requests', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ page_resource_id: resolved.resource_id, note: 'Requested from the page reader' })
      });
      verifyButtons.forEach(function(b) { b.textContent = 'Verification requested'; });
    } catch (error) {
      if (error.message !== 'Editing cancelled') window.alert(error.message);
      verifyButtons.forEach(function(b) { b.disabled = false; });
    }
  }

  const ICONS = {
    download: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12m0 0 5-5m-5 5-5-5M4 21h16"/></svg>',
    verify: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 13 4 4L19 7"/></svg>',
    edit: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25z"/><path d="m14.06 6.19 3.75 3.75"/></svg>'
  };

  function makeCluster() {
    const cluster = document.createElement('span');
    cluster.className = 'dp-actions';
    const make = function(label, icon, title, handler, primary) {
      const button = document.createElement('button');
      button.className = 'dp-abtn' + (primary ? ' dp-abtn--primary' : '');
      button.title = title;
      button.innerHTML = ICONS[icon] + label;
      button.addEventListener('click', function() { handler(button); });
      cluster.appendChild(button);
      return button;
    };
    make('md', 'download', 'Download this page as Markdown', download, false);
    verifyButtons.push(make('Verify', 'verify', 'Request verification of this page against the fabric', verify, false));
    make('Edit', 'edit', 'Edit this page here', function(b) { edit(b); }, true);
    return cluster;
  }

  const titleText = contentHeader.textContent.trim();
  contentHeader.appendChild(makeCluster());

  // Persistent context bar: appears once the H1 leaves the viewport.
  const bar = document.createElement('div');
  bar.className = 'dp-ctxbar';
  const crumbs = document.createElement('span');
  crumbs.className = 'dp-ctxbar__crumbs';
  const segments = path === '' ? [] : path.split('/');
  crumbs.textContent = segments.slice(0, -1)
    .map(function(s) { return s.replace(/[-_]/g, ' ').replace(/\b\w/g, function(c) { return c.toUpperCase(); }); })
    .join(' / ') + (segments.length > 1 ? ' /' : '');
  const title = document.createElement('span');
  title.className = 'dp-ctxbar__title';
  title.textContent = titleText || document.title;
  bar.append(crumbs, title);
  const badge = strip ? strip.querySelector('.dp-badge') : null;
  if (badge) bar.appendChild(badge.cloneNode(true));
  bar.appendChild(makeCluster());
  document.body.appendChild(bar);

  const header = document.querySelector('.md-header');
  function placeBar() {
    if (header) bar.style.setProperty('--dp-ctxbar-top', header.getBoundingClientRect().height + 'px');
  }
  placeBar();
  window.addEventListener('resize', placeBar);

  new IntersectionObserver(function(entries) {
    bar.classList.toggle('dp-ctxbar--visible', !entries[0].isIntersecting);
  }, { rootMargin: '-60px 0px 0px 0px' }).observe(contentHeader);
});
</script>
<script>
// Domain nav bands (S9-C): build_nav emits the four domain groups as
// top-level nav sections; this decorates them with the band classes and
// glyphs styled by reader.css. Glyphs are kept in lockstep with
// generator._DOMAIN_ICONS (book = know, gears = model, graph = observe,
// hammer = work).
document.addEventListener('DOMContentLoaded', function() {
  var NAV_ICONS = {
    Know: '<svg class="dp-nav-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>',
    Model: '<svg class="dp-nav-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>',
    Observe: '<svg class="dp-nav-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 20V10M12 20V4M6 20v-6"/></svg>',
    Work: '<svg class="dp-nav-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 12-8.373 8.373a1 1 0 1 1-3-3L12 9"/><path d="m18 15 4-4"/><path d="m21.5 11.5-1.914-1.914A2 2 0 0 1 19 8.172V7l-2.26-2.26a6 6 0 0 0-4.202-1.756L9 2.96l.92.82A6.18 6.18 0 0 1 12 8.4V10l2 2h1.172a2 2 0 0 1 1.414.586L18.5 14.5"/></svg>'
  };
  document.querySelectorAll('.md-nav--primary > .md-nav__list > .md-nav__item').forEach(function(item) {
    var link = item.querySelector(':scope > .md-nav__link');
    if (!link) return;
    var label = link.textContent.trim();
    if (!Object.prototype.hasOwnProperty.call(NAV_ICONS, label)) return;
    item.classList.add('dp-nav-domain', 'dp-nav-domain--' + label.toLowerCase());
    link.insertAdjacentHTML('afterbegin', NAV_ICONS[label]);
  });
});
</script>
<script>
// The shared Docs | Dashboard switcher. Markup and labels are IDENTICAL to the
// dashboard header's .topnav (dashboard/static/index.html); styling comes from
// the single shared /assets/header.css so the two surfaces carry one header,
// not two lookalikes. Keep the two markup blocks in lockstep when editing.
document.addEventListener("DOMContentLoaded", function() {
  var inner = document.querySelector(".md-header__inner");
  if (!inner || inner.querySelector(".topnav")) return;
  var nav = document.createElement("nav");
  nav.className = "topnav";
  nav.setAttribute("aria-label", "DocPlane sections");
  nav.innerHTML =
    '<span class="navlink navlink--active" title="Browse documentation"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5a2 2 0 0 1 2-2h8l4 4v12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/><path d="M14 3v4h4"/></svg>Docs</span>' +
    '<a class="navlink" href="/dashboard/" title="Open the authoring dashboard"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>Dashboard</a>';
  // Left cluster, immediately after the brand/title — the SAME position the
  // dashboard gives it. Surface-specific controls (search here, connection
  // state there) live on the right, so toggling surfaces never moves the
  // switcher under the pointer.
  var title = inner.querySelector(".md-header__title");
  if (title) title.insertAdjacentElement("afterend", nav); else inner.appendChild(nav);
});
</script>
{% endblock %}
