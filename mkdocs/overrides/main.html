{% extends "base.html" %}

{% block scripts %}
{{ super() }}
<link rel="stylesheet" href="/assets/inline-editor.css">
<script src="/assets/inline-editor.js" defer></script>
<!-- Mermaid diagrams. pymdownx.superfences emits <pre class="mermaid"><code>…</code></pre>;
     Mermaid v10+ wants <pre class="mermaid">…</pre> (no inner <code>), so unwrap first.
     NOTE: loaded from a CDN for convenience — if your docs are private or must
     work offline, download mermaid.min.js into docs-api-rendered assets or the
     overrides dir and change this src to a local path. -->
<script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function() {
  document.querySelectorAll('pre.mermaid > code').forEach(function(code) {
    var pre = code.parentElement;
    pre.textContent = code.textContent;
  });
  if (typeof mermaid !== 'undefined') {
    mermaid.initialize({ startOnLoad: false, theme: 'default' });
    mermaid.run({ querySelector: 'pre.mermaid' });
  }
});
</script>
<script>
// Reader-page actions. Markdown download and visual editing resolve the same
// canonical candidates, but editing stays in this page and frame.
document.addEventListener('DOMContentLoaded', function() {
  const contentHeader = document.querySelector('.md-content__inner h1');
  if (!contentHeader) return;

  const path = window.location.pathname.replace(/\/$/, '').replace(/^\//, '');
  // /guides/backups/ may be guides/backups.md OR guides/backups/index.md.
  const candidates = path === ''
    ? ['index.md']
    : [path + '.md', path + '/index.md'];
  const filename = (path === '' ? 'index' : path.split('/').pop()) + '.md';

  const btn = document.createElement('button');
  btn.className = 'md-download-source';
  btn.title = 'Download as Markdown';
  btn.setAttribute('aria-label', 'Download this page as Markdown');
  btn.style.cssText = 'background:none;border:none;cursor:pointer;margin-left:.4rem;vertical-align:middle;width:1.2em;height:1.2em;color:inherit;opacity:.6;';
  btn.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="100%" height="100%"><path fill="currentColor" d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>';

  btn.addEventListener('click', async function() {
    for (const candidate of candidates) {
      const rawUrl = '/raw/' + candidate;
      try {
        const resp = await fetch(rawUrl, { cache: 'no-cache' });
        if (!resp.ok) continue;
        const blob = await resp.blob();
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        a.click();
        URL.revokeObjectURL(url);
        return;
      } catch (e) { /* try next candidate */ }
    }
    window.open('/raw/' + candidates[0], '_blank');
  });

  contentHeader.appendChild(btn);

  const editBtn = document.createElement('button');
  editBtn.className = 'md-edit-source';
  editBtn.title = 'Edit this page';
  editBtn.setAttribute('aria-label', 'Edit this page here');
  editBtn.style.cssText = 'background:none;border:none;cursor:pointer;margin-left:.4rem;vertical-align:middle;width:1.2em;height:1.2em;color:inherit;opacity:.6;';
  editBtn.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="100%" height="100%"><path fill="currentColor" d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04a.996.996 0 0 0 0-1.41l-2.34-2.34a.996.996 0 0 0-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>';
  editBtn.addEventListener('click', function() {
    if (!window.DocPlaneInlineEditor) {
      window.alert('The visual editor is not available. Reload this page and try again.');
      return;
    }
    window.DocPlaneInlineEditor.start({
      candidates: candidates,
      articleSelector: '.md-content__inner',
      trigger: editBtn
    });
  });

  contentHeader.appendChild(editBtn);
});
</script>
<script>
// Docs -> dashboard header link (symmetric with the dashboard's "Docs" link).
document.addEventListener("DOMContentLoaded", function() {
  var inner = document.querySelector(".md-header__inner");
  if (!inner || inner.querySelector(".md-header__dashboard")) return;
  var a = document.createElement("a");
  a.className = "md-header__dashboard md-header__button md-icon";
  a.href = "/dashboard/";
  a.title = "Open the authoring dashboard";
  a.setAttribute("aria-label", "Authoring dashboard");
  a.innerHTML = '<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 24 24\" width=\"1.2rem\" height=\"1.2rem\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3\" y=\"3\" width=\"7\" height=\"7\" rx=\"1\"/><rect x=\"14\" y=\"3\" width=\"7\" height=\"7\" rx=\"1\"/><rect x=\"3\" y=\"14\" width=\"7\" height=\"7\" rx=\"1\"/><rect x=\"14\" y=\"14\" width=\"7\" height=\"7\" rx=\"1\"/></svg>';
  var search = inner.querySelector(".md-header__option, .md-search");
  if (search) inner.insertBefore(a, search); else inner.appendChild(a);
});
</script>
{% endblock %}
